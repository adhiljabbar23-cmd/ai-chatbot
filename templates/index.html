<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI ChatBot — by Adhil</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #f093fb 50%, #f5576c 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .chat-wrapper {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chat-card {
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .chat-header {
      background: linear-gradient(135deg, rgba(102,126,234,0.8), rgba(240,147,251,0.8));
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .bot-avatar {
      width: 46px; height: 46px;
      background: rgba(255,255,255,0.25);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      border: 2px solid rgba(255,255,255,0.4);
      animation: pulse-avatar 2.5s ease-in-out infinite;
    }

    @keyframes pulse-avatar {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.4); }
      50% { box-shadow: 0 0 0 8px rgba(255,255,255,0); }
    }

    .header-text h2 { color: #fff; font-size: 16px; font-weight: 600; }
    .header-text p  { color: rgba(255,255,255,0.8); font-size: 12px; margin-top: 2px; display: flex; align-items: center; gap: 5px; }

    .status-dot {
      width: 7px; height: 7px;
      background: #7fff7f;
      border-radius: 50%;
      animation: blink 2s infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }

    .header-actions { margin-left: auto; display: flex; gap: 8px; }
    .action-btn {
      background: rgba(255,255,255,0.2);
      border: none; border-radius: 8px;
      padding: 6px 10px; color: #fff;
      font-size: 11px; font-weight: 500;
      cursor: pointer; transition: background 0.2s;
    }
    .action-btn:hover { background: rgba(255,255,255,0.35); }

    .chat-messages {
      height: 400px;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.2) transparent;
    }
    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

    .date-divider {
      text-align: center;
      color: rgba(255,255,255,0.5);
      font-size: 11px;
      padding: 4px 0;
    }

    .message-group { display: flex; flex-direction: column; gap: 4px; }
    .message-group.user { align-items: flex-end; }
    .message-group.bot  { align-items: flex-start; }

    .message-row { display: flex; align-items: flex-end; gap: 8px; max-width: 88%; }
    .message-group.user .message-row { flex-direction: row-reverse; }

    .msg-avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0;
    }
    .bot  .msg-avatar { background: linear-gradient(135deg,#667eea,#f093fb); }
    .user .msg-avatar { background: linear-gradient(135deg,#f5576c,#f093fb); }

    .bubble {
      padding: 11px 15px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.55;
      word-wrap: break-word;
      animation: pop-in 0.25s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes pop-in {
      from { transform: scale(0.85); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }

    .bot  .bubble {
      background: rgba(255,255,255,0.18);
      color: #fff;
      border-bottom-left-radius: 5px;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .user .bubble {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border-bottom-right-radius: 5px;
    }

    .meta-row {
      display: flex; align-items: center; gap: 6px;
      padding: 0 4px;
    }
    .message-group.user .meta-row { flex-direction: row-reverse; }

    .timestamp { font-size: 10px; color: rgba(255,255,255,0.45); }

    .confidence-pill {
      font-size: 10px; font-weight: 500;
      padding: 1px 7px;
      border-radius: 20px;
      display: none;
    }
    .confidence-pill.high   { background: rgba(127,255,127,0.2); color: #7fff7f; border: 1px solid rgba(127,255,127,0.3); }
    .confidence-pill.medium { background: rgba(255,220,100,0.2); color: #ffd964; border: 1px solid rgba(255,220,100,0.3); }
    .confidence-pill.low    { background: rgba(255,100,100,0.2); color: #ff8080; border: 1px solid rgba(255,100,100,0.3); }

    .tag-pill {
      font-size: 10px;
      padding: 1px 7px;
      border-radius: 20px;
      background: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.5);
      border: 1px solid rgba(255,255,255,0.15);
      display: none;
    }

    .typing-bubble {
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 18px;
      border-bottom-left-radius: 5px;
      padding: 14px 18px;
      display: flex; gap: 5px; align-items: center;
    }
    .typing-bubble span {
      width: 7px; height: 7px;
      background: rgba(255,255,255,0.7);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing-bubble span:nth-child(2) { animation-delay: 0.2s; }
    .typing-bubble span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    .suggestions {
      display: flex; flex-wrap: wrap; gap: 6px;
      padding: 0 16px 12px;
    }
    .suggest-btn {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      color: rgba(255,255,255,0.85);
      font-size: 12px; padding: 5px 12px;
      cursor: pointer; transition: all 0.2s;
      font-family: 'Inter', sans-serif;
    }
    .suggest-btn:hover {
      background: rgba(255,255,255,0.25);
      color: #fff;
    }

    .chat-input-area {
      padding: 12px 16px 16px;
      display: flex; gap: 10px; align-items: center;
      border-top: 1px solid rgba(255,255,255,0.15);
    }

    #user-input {
      flex: 1;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 24px;
      padding: 11px 18px;
      color: #fff;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    #user-input::placeholder { color: rgba(255,255,255,0.4); }
    #user-input:focus {
      border-color: rgba(255,255,255,0.5);
      background: rgba(255,255,255,0.18);
    }

    #send-btn {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, #667eea, #f093fb);
      border: none; border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s, opacity 0.15s;
      flex-shrink: 0;
    }
    #send-btn:hover { transform: scale(1.08); }
    #send-btn:active { transform: scale(0.95); }
    #send-btn svg { width: 18px; height: 18px; fill: white; }

    .toggle-bar {
      display: flex; gap: 8px; padding: 0 16px 10px;
    }
    .toggle-item {
      display: flex; align-items: center; gap: 5px;
      font-size: 11px; color: rgba(255,255,255,0.6);
      cursor: pointer; user-select: none;
    }
    .toggle-item input { accent-color: #f093fb; }

    .stats-bar {
      background: rgba(255,255,255,0.08);
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 8px 20px;
      display: flex; justify-content: space-between;
      font-size: 11px; color: rgba(255,255,255,0.45);
    }
  </style>
</head>
<body>
<div class="chat-wrapper">
  <div class="chat-card">
    <div class="chat-header">
      <div class="bot-avatar">&#129302;</div>
      <div class="header-text">
        <h2>AI ChatBot</h2>
        <p><span class="status-dot"></span> Online &mdash; Python + NLP + ML</p>
      </div>
      <div class="header-actions">
        <button class="action-btn" onclick="clearChat()">Clear</button>
      </div>
    </div>

    <div class="chat-messages" id="chat-messages">
      <div class="date-divider">Today</div>
      <div class="message-group bot">
        <div class="message-row">
          <div class="msg-avatar">&#129302;</div>
          <div class="bubble">Hey! I'm Adhil's AI ChatBot built with Python, NLTK &amp; Scikit-learn. Ask me about AI, ML, Python — or just chat!</div>
        </div>
        <div class="meta-row"><span class="timestamp" id="start-time"></span></div>
      </div>
    </div>

    <div class="suggestions" id="suggestions">
      <button class="suggest-btn" onclick="quickSend('Tell me a joke')">Tell me a joke</button>
      <button class="suggest-btn" onclick="quickSend('What is machine learning?')">What is ML?</button>
      <button class="suggest-btn" onclick="quickSend('Quiz me on Python')">Python quiz</button>
      <button class="suggest-btn" onclick="quickSend('Motivate me')">Motivate me</button>
    </div>

    <div class="toggle-bar">
      <label class="toggle-item"><input type="checkbox" id="show-confidence" checked> Show confidence</label>
      <label class="toggle-item"><input type="checkbox" id="show-tag" checked> Show intent</label>
      <label class="toggle-item"><input type="checkbox" id="play-sound" checked> Sound</label>
    </div>

    <div class="chat-input-area">
      <input type="text" id="user-input" placeholder="Type a message..." autocomplete="off"/>
      <button id="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><path d="M2 21L23 12 2 3v7l15 2-15 2v7z"/></svg>
      </button>
    </div>

    <div class="stats-bar">
      <span>Messages: <span id="msg-count">0</span></span>
      <span>Built by Adhil &mdash; NLTK + Scikit-learn</span>
    </div>
  </div>
</div>

<script>
  const messagesEl = document.getElementById('chat-messages');
  const inputEl    = document.getElementById('user-input');
  let msgCount = 0;

  document.getElementById('start-time').textContent = now();

  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

  function now() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function playSound(type) {
    if (!document.getElementById('play-sound').checked) return;
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    if (type === 'send') { o.frequency.value = 520; g.gain.setValueAtTime(0.08, ctx.currentTime); }
    else { o.frequency.value = 440; g.gain.setValueAtTime(0.06, ctx.currentTime); }
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
    o.stop(ctx.currentTime + 0.13);
  }

  function addUserMessage(text) {
    const t = now();
    const group = document.createElement('div');
    group.className = 'message-group user';
    group.innerHTML = `
      <div class="message-row">
        <div class="msg-avatar">&#128100;</div>
        <div class="bubble">${escHtml(text)}</div>
      </div>
      <div class="meta-row"><span class="timestamp">${t}</span></div>`;
    messagesEl.appendChild(group);
    scroll();
    msgCount++;
    document.getElementById('msg-count').textContent = msgCount;
  }

  function addBotMessage(text, tag, confidence) {
    const t = now();
    const showConf = document.getElementById('show-confidence').checked;
    const showTag  = document.getElementById('show-tag').checked;

    let confClass = 'high';
    if (confidence < 50) confClass = 'low';
    else if (confidence < 75) confClass = 'medium';

    const group = document.createElement('div');
    group.className = 'message-group bot';
    group.innerHTML = `
      <div class="message-row">
        <div class="msg-avatar">&#129302;</div>
        <div class="bubble">${escHtml(text)}</div>
      </div>
      <div class="meta-row">
        <span class="timestamp">${t}</span>
        <span class="confidence-pill ${confClass}" style="display:${showConf?'inline':'none'}">${confidence}% confident</span>
        <span class="tag-pill" style="display:${showTag?'inline':'none'}">#${tag}</span>
      </div>`;
    messagesEl.appendChild(group);
    scroll();
    msgCount++;
    document.getElementById('msg-count').textContent = msgCount;
    playSound('receive');
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'message-group bot'; div.id = 'typing';
    div.innerHTML = `<div class="message-row"><div class="msg-avatar">&#129302;</div><div class="typing-bubble"><span></span><span></span><span></span></div></div>`;
    messagesEl.appendChild(div); scroll();
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  function scroll() { messagesEl.scrollTop = messagesEl.scrollHeight; }

  function escHtml(t) {
    return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function quickSend(text) {
    inputEl.value = text;
    sendMessage();
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;
    addUserMessage(text);
    inputEl.value = '';
    playSound('send');
    showTyping();
    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      setTimeout(() => {
        removeTyping();
        addBotMessage(data.response, data.tag || 'unknown', data.confidence || 0);
      }, 700);
    } catch {
      removeTyping();
      addBotMessage("Oops! Can't reach the server. Make sure app.py is running.", 'error', 0);
    }
  }

  function clearChat() {
    messagesEl.innerHTML = '<div class="date-divider">Chat cleared</div>';
    msgCount = 0;
    document.getElementById('msg-count').textContent = 0;
  }
</script>
</body>
</html>
